name: Test import via p12-filepath
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate self-signed certificate and PKCS12 file
        run: |
          # Generate a self-signed certificate and private key
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/key.pem -out /tmp/cert.pem \
            -days 1 -nodes -subj "/CN=TestFilepathCert"
          # Create PKCS12 file with a known password
          openssl pkcs12 -export -out "$GITHUB_WORKSPACE/test-cert.p12" \
            -inkey /tmp/key.pem -in /tmp/cert.pem \
            -passout pass:filepathpass

      - id: action
        uses: .
        with:
          p12-filepath: test-cert.p12
          p12-password: filepathpass
          keychain: filepath_test_keychain
          keychain-password: keychainpass456
          create-keychain: 'true'

      - name: Assert keychain-password output is set
        env:
          ACTUAL: ${{ steps.action.outputs.keychain-password }}
        run: |
          echo "actual keychain-password: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: keychain-password output should not be empty"
            exit 1
          fi
          echo "PASS: keychain-password is set"

      - name: Assert security-response output is set
        env:
          ACTUAL: ${{ steps.action.outputs.security-response }}
        run: |
          echo "actual security-response: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: security-response output should not be empty"
            exit 1
          fi
          echo "PASS: security-response is set"

      - name: Assert keychain exists
        run: |
          if ! security list-keychains | grep -q "filepath_test_keychain"; then
            echo "FAIL: filepath_test_keychain not found in keychain list"
            exit 1
          fi
          echo "PASS: filepath_test_keychain exists"
