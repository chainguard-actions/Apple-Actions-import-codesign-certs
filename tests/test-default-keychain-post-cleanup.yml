name: Test default keychain with post cleanup (fake security binary)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide a fake 'security' binary so the post cleanup step can run on Linux
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/security" <<'EOF'
          #!/bin/sh
          echo "fake security $*"
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/security"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          p12-file-base64: 'ZHVtbXktcDEyLWNvbnRlbnQ='
          p12-password: 'test-password'
      - name: Assert main step failed on non-macOS with no outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          KC_PASSWORD: ${{ steps.action.outputs.keychain-password }}
        run: |
          echo "uname: $(uname)"
          echo "outcome: $OUTCOME"
          if [ "$(uname)" = "Darwin" ]; then
            echo "Running on macOS; non-macOS scenario not applicable"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on non-macOS runner, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$KC_PASSWORD" ]; then
            echo "FAIL: keychain-password should not be set"
            exit 1
          fi
          echo "PASS"
