name: Test import with custom keychain password and file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a self-signed P12 certificate for testing
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/custom-key.pem \
            -out /tmp/custom-cert.pem -days 1 -nodes \
            -subj "/CN=Custom Keychain Test/O=Test Org/C=US"
          openssl pkcs12 -export \
            -in /tmp/custom-cert.pem \
            -inkey /tmp/custom-key.pem \
            -out /tmp/custom-cert.p12 \
            -passout pass:p12secret456

      - id: import
        uses: .
        with:
          keychain: test_signing_custom
          create-keychain: 'true'
          keychain-password: mykeychain_secret_pw
          p12-filepath: /tmp/custom-cert.p12
          p12-password: p12secret456

      - name: Assert keychain-password output matches provided password
        env:
          ACTUAL: ${{ steps.import.outputs.keychain-password }}
        run: |
          echo "actual keychain-password: $ACTUAL"
          if [ "$ACTUAL" != "mykeychain_secret_pw" ]; then
            echo "FAIL: expected keychain-password to be 'mykeychain_secret_pw', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: keychain-password matches the provided custom password"

      - name: Assert security-response output is set
        env:
          ACTUAL: ${{ steps.import.outputs.security-response }}
        run: |
          echo "actual security-response: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: security-response output should not be empty"
            exit 1
          fi
          echo "PASS: security-response is set"

      - name: Assert keychain was created and is accessible
        run: |
          if ! security list-keychains | grep -q "test_signing_custom.keychain"; then
            echo "FAIL: keychain test_signing_custom.keychain not found in list"
            exit 1
          fi
          echo "PASS: custom keychain is present in list"
