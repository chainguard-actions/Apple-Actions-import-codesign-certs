name: Test non-macOS runner rejected (base64 input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          create-keychain: 'false'
          p12-file-base64: 'ZHVtbXktcDEyLWNvbnRlbnQ='
          p12-password: 'test-password'
      - name: Assert action failed because runner is not macOS
        env:
          OUTCOME: ${{ steps.action.outcome }}
          KC_PASSWORD: ${{ steps.action.outputs.keychain-password }}
          IDENTITIES: ${{ steps.action.outputs.identities }}
        run: |
          echo "uname: $(uname)"
          echo "outcome: $OUTCOME"
          echo "keychain-password set: ${KC_PASSWORD:+yes}"
          echo "identities: $IDENTITIES"
          if [ "$(uname)" = "Darwin" ]; then
            echo "Running on macOS; non-macOS scenario not applicable"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on non-macOS runner, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$KC_PASSWORD" ] || [ -n "$IDENTITIES" ]; then
            echo "FAIL: no outputs expected when platform check fails"
            exit 1
          fi
          echo "PASS"
