name: Test error when no P12 certificate is provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: import
        uses: .
        with:
          keychain: test_signing_error
          create-keychain: 'true'
          p12-password: somepassword
        # Expect this step to fail — action should throw when no P12 is given
        continue-on-error: true

      - name: Assert action failed with missing P12 error
        env:
          OUTCOME: ${{ steps.import.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no P12 is provided, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no P12 certificate was provided"
