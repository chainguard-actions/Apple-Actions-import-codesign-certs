name: Test basic certificate import
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate self-signed test certificate
        id: gen-cert
        run: |
          # Generate a self-signed certificate and export as P12
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/test-key.pem \
            -out /tmp/test-cert.pem -days 1 -nodes \
            -subj "/CN=Test Code Signing/O=Test Org/C=US"
          openssl pkcs12 -export \
            -out /tmp/test-cert.p12 \
            -inkey /tmp/test-key.pem \
            -in /tmp/test-cert.pem \
            -passout pass:testpassword123
          P12_BASE64=$(base64 -i /tmp/test-cert.p12)
          echo "p12-base64=$P12_BASE64" >> $GITHUB_OUTPUT

      - name: Import certificate into default keychain
        id: action
        uses: .
        with:
          p12-file-base64: ${{ steps.gen-cert.outputs.p12-base64 }}
          p12-password: testpassword123

      - name: Assert keychain-password output is set
        env:
          KEYCHAIN_PASSWORD: ${{ steps.action.outputs.keychain-password }}
        run: |
          echo "keychain-password: $KEYCHAIN_PASSWORD"
          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "FAIL: expected keychain-password output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert security-response output is set
        env:
          SECURITY_RESPONSE: ${{ steps.action.outputs.security-response }}
        run: |
          echo "security-response: $SECURITY_RESPONSE"
          if [ -z "$SECURITY_RESPONSE" ]; then
            echo "FAIL: expected security-response output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert keychain exists
        run: |
          if ! security list-keychains | grep -q "signing_temp"; then
            echo "FAIL: expected signing_temp keychain to exist"
            exit 1
          fi
          echo "PASS: signing_temp keychain found"
