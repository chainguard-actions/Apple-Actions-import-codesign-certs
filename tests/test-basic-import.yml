name: Test basic certificate import
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate self-signed p12 for testing
        id: gen-cert
        run: |
          # Generate a self-signed certificate and export as p12
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/test-key.pem \
            -out /tmp/test-cert.pem -days 1 -nodes \
            -subj "/CN=Test Code Signing/O=Test Org/C=US"
          openssl pkcs12 -export \
            -inkey /tmp/test-key.pem \
            -in /tmp/test-cert.pem \
            -out /tmp/test-cert.p12 \
            -passout pass:testpassword123
          P12_BASE64=$(base64 -i /tmp/test-cert.p12)
          echo "p12-base64=$P12_BASE64" >> $GITHUB_OUTPUT

      - id: action
        uses: .
        with:
          p12-file-base64: ${{ steps.gen-cert.outputs.p12-base64 }}
          p12-password: testpassword123

      - name: Assert keychain-password output is set
        env:
          ACTUAL: ${{ steps.action.outputs.keychain-password }}
        run: |
          echo "actual keychain-password: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected keychain-password output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert security-response output is set
        env:
          ACTUAL: ${{ steps.action.outputs.security-response }}
        run: |
          echo "actual security-response: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected security-response output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert default keychain was created
        run: |
          # The default keychain name is signing_temp
          KEYCHAIN_LIST=$(security list-keychains)
          echo "Keychains: $KEYCHAIN_LIST"
          if echo "$KEYCHAIN_LIST" | grep -q "signing_temp"; then
            echo "PASS: signing_temp keychain found"
          else
            echo "FAIL: signing_temp keychain not found in list"
            exit 1
          fi
