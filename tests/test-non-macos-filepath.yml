name: Test non-macOS runner rejected (p12 filepath input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy p12 file
        run: printf 'dummy' > "$RUNNER_TEMP/cert.p12"
      - id: action
        uses: .
        continue-on-error: true
        with:
          keychain: 'custom_keychain'
          create-keychain: 'false'
          keychain-password: 'kc-pass'
          p12-filepath: ${{ runner.temp }}/cert.p12
          p12-password: 'test-password'
      - name: Assert action failed because runner is not macOS
        env:
          OUTCOME: ${{ steps.action.outcome }}
          KC_PASSWORD: ${{ steps.action.outputs.keychain-password }}
          RESPONSE: ${{ steps.action.outputs.security-response }}
        run: |
          echo "uname: $(uname)"
          echo "outcome: $OUTCOME"
          echo "security-response: $RESPONSE"
          if [ "$(uname)" = "Darwin" ]; then
            echo "Running on macOS; non-macOS scenario not applicable"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on non-macOS runner, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$KC_PASSWORD" ] || [ -n "$RESPONSE" ]; then
            echo "FAIL: no outputs expected when platform check fails"
            exit 1
          fi
          echo "PASS"
