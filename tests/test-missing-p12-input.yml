name: Test missing p12 input error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          keychain: signing_temp
          create-keychain: 'true'
          p12-password: 'test-password'
          # Neither p12-filepath nor p12-file-base64 provided

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no p12 input provided, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no p12 input provided"
