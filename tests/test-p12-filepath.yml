name: Test import via P12 file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate self-signed test certificate as P12 file
        run: |
          # Generate a self-signed certificate and export as P12 file
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/filepath-key.pem \
            -out /tmp/filepath-cert.pem -days 1 -nodes \
            -subj "/CN=Test Filepath Signing/O=Test Org/C=US"
          openssl pkcs12 -export \
            -out /tmp/filepath-cert.p12 \
            -inkey /tmp/filepath-key.pem \
            -in /tmp/filepath-cert.pem \
            -passout pass:filepathpass789

      - name: Import certificate using file path
        id: action
        uses: .
        with:
          keychain: filepath_test_keychain
          create-keychain: 'true'
          keychain-password: filepath_keychain_pw
          p12-filepath: /tmp/filepath-cert.p12
          p12-password: filepathpass789

      - name: Assert keychain-password output is set
        env:
          KEYCHAIN_PASSWORD: ${{ steps.action.outputs.keychain-password }}
        run: |
          echo "keychain-password: $KEYCHAIN_PASSWORD"
          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "FAIL: expected keychain-password output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert security-response output is set
        env:
          SECURITY_RESPONSE: ${{ steps.action.outputs.security-response }}
        run: |
          echo "security-response: $SECURITY_RESPONSE"
          if [ -z "$SECURITY_RESPONSE" ]; then
            echo "FAIL: expected security-response output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert filepath_test_keychain exists
        run: |
          if ! security list-keychains | grep -q "filepath_test_keychain"; then
            echo "FAIL: expected filepath_test_keychain keychain to exist"
            exit 1
          fi
          echo "PASS: filepath_test_keychain keychain found"
