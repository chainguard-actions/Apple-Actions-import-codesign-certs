name: Test p12 file path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Generate a self-signed PKCS12 certificate and write it to a file path
      - name: Generate test PKCS12 certificate file
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/test-key.pem \
            -out /tmp/test-cert.pem -days 1 -nodes \
            -subj "/CN=Filepath Test/O=Test Org/C=US"
          openssl pkcs12 -export -out "$GITHUB_WORKSPACE/test-cert.p12" \
            -inkey /tmp/test-key.pem \
            -in /tmp/test-cert.pem \
            -passout pass:filepassword

      - id: action
        uses: .
        continue-on-error: true
        with:
          keychain: signing_temp
          create-keychain: 'true'
          p12-filepath: test-cert.p12
          p12-password: filepassword

      - name: Assert action ran using file path input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          KEYCHAIN_PASSWORD: ${{ steps.action.outputs.keychain-password }}
          SECURITY_RESPONSE: ${{ steps.action.outputs.security-response }}
        run: |
          echo "outcome: $OUTCOME"
          echo "keychain-password set: $([ -n "$KEYCHAIN_PASSWORD" ] && echo yes || echo no)"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$KEYCHAIN_PASSWORD" ]; then
              echo "FAIL: action succeeded but keychain-password output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with p12-filepath input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on non-macOS runner without 'security' command)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
