name: Test invalid keychain name error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          keychain: 'my_keychain.keychain'
          p12-file-base64: 'dGVzdA=='
          p12-password: 'test-password'

      - name: Assert action failed due to invalid keychain name or non-macOS
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid keychain name or non-macOS, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed"
