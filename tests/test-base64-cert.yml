name: Test base64 certificate input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          keychain: signing_temp
          create-keychain: 'true'
          keychain-password: 'test-keychain-password'
          p12-file-base64: 'dGVzdA=='
          p12-password: 'test-p12-password'
      - name: Assert inputs were accepted
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: action was invoked with all required inputs"
